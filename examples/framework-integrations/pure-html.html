<!doctype html>
<html lang="en">
  <body>
    <canvas id="agent" width="640" height="360" aria-label="Agent status"></canvas>
    <output id="status" role="status" aria-live="polite">thinking</output>
    <script type="module">
      import { mountAgentCanvasSelector } from "aigpu";
      const status = document.querySelector("#status");
      const controller = mountAgentCanvasSelector("#agent", {
        label: "pure-html-agent",
        initial: { status: "thinking", activity: 0.7 },
        surface: { dpr: [1, 2] },
      });
      controller.set({ status: "working", progress: 0.45, activity: 0.9 });
      status.textContent = "working";
      addEventListener("pagehide", () => controller.destroy(), { once: true });
    </script>
  </body>
</html>
